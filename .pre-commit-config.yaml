ci:
  autoupdate_schedule: "quarterly"
repos:
- repo: https://github.com/psf/black-pre-commit-mirror
  rev: 26.10.0
  hooks:
  - id: black
    files: ^physical_validation
- repo: https://github.com/PyCQA/isort
  rev: 9.0.2
  hooks:
  - id: isort
    files: ^physical_validation
- repo: https://github.com/PyCQA/flake8
  rev: 7.4.1
  hooks:
  - id: flake8
    files: ^physical_validation
